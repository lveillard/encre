[package]
name = "encre-css-icons"
version = "0.7.1"
description = "Quickly add pure CSS icons to your website"
license = "MIT"
edition = "2021"
repository = "https://gitlab.com/encre-org/encre-css.git"
documentation = "https://docs.rs/encre-css-icons"
keywords = ["tailwind", "css", "compiler", "encre-css"]
categories = ["web-programming"]

[dependencies]
encre-css = { path = "../encre-css", version = "0.20.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = { version = "6.0.0", optional = true }
once_cell = "1.21.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
ureq = "3.0.12"
include_dir = { version = "0.7.4", optional = true }

[features]
default = ["fs-cache"]
fs-cache = ["directories"]
embed-icons = ["include_dir"]
